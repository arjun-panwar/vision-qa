<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Model Comparison</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>

<body>
    <div class="container">
        <!-- Left Sidebar: Image List -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Images</h2>
                <button id="btn-load-project" class="btn-primary">Load Project</button>
            </div>
            <ul id="image-list">
                <!-- Populated by JS -->
            </ul>
        </aside>

        <!-- Center Stage: Image and Overlay -->
        <main class="main-view">
            <div id="canvas-container" class="canvas-wrapper">
                <img id="source-image" src="" alt="Select an image" />
                <canvas id="overlay-canvas"></canvas>
            </div>
        </main>

        <!-- Right Control Panel -->
        <aside class="controls">
            <h2>Controls</h2>

            <div class="control-group">
                <h3>Models</h3>
                <div id="model-toggles">
                    <!-- Dynamic model toggles -->
                </div>
            </div>

            <div class="control-group">
                <h3>Zoom & Pan</h3>
                <div class="button-row" style="display: flex; gap: 5px; margin-bottom: 10px;">
                    <button id="btn-zoom-in" class="btn-primary" style="flex:1;">+</button>
                    <button id="btn-zoom-out" class="btn-primary" style="flex:1;">-</button>
                    <button id="btn-reset-view" class="btn-primary" style="flex:1;">Reset</button>
                </div>
                <p style="font-size: 0.8rem; color: #a0a0a0; margin: 0;">Use Mouse Wheel to Zoom, Drag to Pan.</p>
            </div>

            <div class="control-group">
                <h3>Visual Settings</h3>
                <div class="slider-container">
                    <label>Box Thickness: <span id="val-thickness">2</span>px</label>
                    <input type="range" id="slider-thickness" min="1" max="10" value="2">
                </div>
                <div class="slider-container" style="margin-top: 10px;">
                    <label>Font Size: <span id="val-fontsize">20</span>px</label>
                    <input type="range" id="slider-fontsize" min="10" max="40" value="20">
                </div>
                <label class="checkbox-label" style="margin-top: 10px;">
                    <input type="checkbox" id="check-labels" checked> Show Class Labels
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="check-scores" checked> Show Scores
                </label>
            </div>

            <div class="control-group">
                <h3>Confidence Threshold</h3>
                <div class="slider-container">
                    <input type="range" id="conf-slider" min="0" max="1" step="0.05" value="0.35">
                    <span id="conf-value">0.35</span>
                </div>
            </div>

            <div class="control-group">
                <h3>Classes</h3>
                <div id="class-filters">
                    <!-- Dynamic checkboxes -->
                </div>
            </div>
        </aside>
    </div>
    <script src="/static/app.js?v=7"></script>
</body>

</html>
