<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Model Comparison</title>
    <link rel="stylesheet" href="/static/style.css?v=12">
</head>

<body>
    <!-- Top Bar: Title, Center Controls, Right Actions -->
    <header class="top-bar">
        <!-- Left: Application Name -->
        <div class="top-bar-left">
            <button id="btn-toggle-left" class="btn-toggle" title="Toggle Image List">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <line x1="9" y1="3" x2="9" y2="21" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-3-3 3-3" />
                </svg>
            </button>
            <span style="margin-left: 10px; margin-right: 15px;">Vision Buzz</span>
        </div>

        <!-- Center: Zoom & Visual Settings -->
        <div class="top-bar-center">
            <div class="top-bar-group">
                <!-- Zoom Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2" style="color: var(--text-muted); margin-right: 4px;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" />
                </svg>
                <div style="display: flex; gap: 5px;">
                    <button id="btn-zoom-in" class="btn-primary">+</button>
                    <button id="btn-zoom-out" class="btn-primary">-</button>
                    <button id="btn-reset-view" class="btn-primary">Reset</button>
                </div>
            </div>

            <div class="top-bar-group" style="padding-left: 1rem; border-left: 1px solid var(--border); gap: 1rem;">

                <div class="slider-container" style="min-width: 140px; display: flex; align-items: center; gap: 5px;">
                    <label style="font-size: 0.9rem; white-space: nowrap;">Thick:</label>
                    <input type="range" id="slider-thickness" min="1" max="10" value="2" style="flex: 1;">
                    <span id="val-thickness" style="width: 20px; text-align: right;">2</span>
                </div>

                <div class="slider-container" style="min-width: 140px; display: flex; align-items: center; gap: 5px;">
                    <label style="font-size: 0.9rem; white-space: nowrap;">Opacity:</label>
                    <input type="range" id="slider-opacity" min="0" max="1" step="0.1" value="0.2" style="flex: 1;">
                    <span id="val-opacity" style="width: 25px; text-align: right;">0.2</span>
                </div>

                <div class="slider-container" style="min-width: 140px; display: flex; align-items: center; gap: 5px;">
                    <label style="font-size: 0.9rem; white-space: nowrap;">Font:</label>
                    <input type="range" id="slider-fontsize" min="10" max="40" value="20" style="flex: 1;">
                    <span id="val-fontsize" style="width: 25px; text-align: right;">20</span>
                </div>

                <label class="checkbox-label" style="margin-bottom: 0; white-space: nowrap;">
                    <input type="checkbox" id="check-labels" checked> Labels
                </label>
                <label class="checkbox-label" style="margin-bottom: 0; white-space: nowrap;">
                    <input type="checkbox" id="check-scores" checked> Scores
                </label>

                <button id="btn-unhide-all" class="btn-primary"
                    style="margin-left: 10px; font-size: 0.8rem; padding: 2px 8px;">Unhide All</button>

                <div id="mode-select" class="segmented-control" style="font-size: 0.8rem; margin-left: 10px;">
                    <button class="segmented-btn active" data-value="normal">Normal</button>
                    <button class="segmented-btn" data-value="compare">Compare</button>
                </div>
            </div>
        </div>

        <!-- Right: Actions -->
        <div class="top-bar-right">
            <button id="btn-load-project" class="btn-primary"
                style="margin-right: 15px; font-size: 0.8rem; padding: 2px 8px;">Load
                Project</button>
            <button id="btn-dashboard" class="btn-primary" onclick="window.location.href='/dashboard'"
                style="margin-right: 15px; font-size: 0.8rem; padding: 2px 8px;">Dashboard</button>
            <button id="btn-toggle-right" class="btn-toggle" title="Toggle Controls">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <line x1="15" y1="3" x2="15" y2="21" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 9l3 3-3 3" />
                </svg>
            </button>
        </div>
    </header>

    <div class="main-layout">
        <!-- Left Sidebar: Image List -->
        <aside class="sidebar">
            <div class="sidebar-header"
                style="flex-direction: column; align-items: stretch; gap: 0.5rem; justify-content: start;">

                <input type="text" id="image-search-input" placeholder="Search images..."
                    style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-dark); color: var(--text-main); width: 100%;">
                <select id="filter-qa" class="filter-select">
                    <option value="all">Filter: All</option>
                    <option value="unreviewed">Unreviewed</option>
                    <option value="correct">Correct</option>
                    <option value="incorrect">Incorrect</option>
                    <option value="doubtful">Doubtful</option>
                </select>
            </div>
            <ul id="image-list">
                <!-- Populated by JS -->
            </ul>
        </aside>

        <!-- Sidebar Resizer -->
        <div id="sidebar-resizer" class="resizer"></div>

        <!-- Center Stage: Image and Overlay -->
        <main class="main-view">
            <!-- Left Canvas (Primary) -->
            <div id="canvas-container-left" class="canvas-wrapper">
                <img id="source-image-left" src="" alt="Select an image" />
                <canvas id="overlay-canvas-left"></canvas>
                <select id="model-select-left" class="view-label-select" title="Select Left Model"
                    style="display: none; position: absolute; top: 10px; right: 10px; z-index: 101;"></select>
            </div>

            <!-- Right Canvas (Secondary - Helper for Split View) -->
            <div id="canvas-container-right" class="canvas-wrapper"
                style="display: none; border-left: 2px solid var(--border);">
                <img id="source-image-right" src="" alt="Select an image" />
                <canvas id="overlay-canvas-right"></canvas>
                <select id="model-select-right" class="view-label-select" title="Select Right Model"
                    style="position: absolute; top: 10px; right: 10px; z-index: 101;"></select>
            </div>
        </main>

        <!-- Right Control Panel -->
        <!-- Right Control Panel -->
        <aside class="controls">

            <!-- Mode control moved to top bar -->

            <div class="control-group">
                <h3>Confidence Threshold</h3>
                <div class="slider-container">
                    <input type="range" id="conf-slider" min="0" max="1" step="0.05" value="0.35">
                    <span id="conf-value">0.35</span>
                </div>
            </div>

            <div class="control-group">
                <h3 id="header-classes">Classes</h3>
                <div id="class-filters">
                    <!-- Dynamic checkboxes and color pickers -->
                </div>
            </div>

            <div class="control-group comments-control-group">
                <h3>Comments</h3>
                <div id="comments-section-sidebar" style="display: flex; flex-direction: column; gap: 8px;">
                    <!-- Populated by JS -->
                    <div style="font-size: 0.8rem; color: var(--text-muted); font-style: italic;">No specific box
                        comments.</div>
                </div>
            </div>
        </aside>
    </div>
    <!-- QA Footer -->
    <footer class="qa-footer"
        style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 1rem; gap: 1rem;">

        <!-- Left: Image Name -->
        <div class="footer-left" style="overflow: hidden; justify-self: start; align-self: end; padding-bottom: 2px;">
            <div id="image-name-container" style="position: relative; display: inline-block; max-width: 100%;">
                <div id="image-name-display" title="Click to copy"
                    style="font-family: monospace; font-size: 0.85rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); border: 1px solid var(--border); padding: 0px 6px; border-radius: 4px; display: block;">
                    Filename.jpg
                </div>

            </div>
        </div>

        <!-- Center: QA Controls + Comment -->
        <div class="footer-center" style="display: flex; align-items: center; gap: 1rem; justify-self: center;">
            <div id="qa-model-select" class="segmented-control">
                <!-- Populated by JS -->
            </div>
            <div class="qa-controls">
                <button class="qa-btn correct" onclick="setQAStatus('correct')">Correct</button>
                <button class="qa-btn incorrect" onclick="setQAStatus('incorrect')">Incorrect</button>
                <button class="qa-btn doubtful" onclick="setQAStatus('doubtful')">Doubtful</button>
            </div>

            <textarea id="qa-comment" class="qa-comment" placeholder="Add a comment..."
                style="width: 400px;"></textarea>
            <div style="border-left: 1px solid #ccc; height: 24px; margin: 0 4px;"></div>
            <button id="btn-flag-mode" class="qa-btn" onclick="toggleFlagMode()">Flag Box</button>
        </div>

        <!-- Right: Navigation + Status -->
        <div class="footer-right" style="display: flex; align-items: center; gap: 1rem; justify-self: end;">
            <div class="nav-controls">
                <button id="btn-prev" class="qa-btn" title="Previous Image">&lt;</button>
                <button id="btn-next" class="qa-btn" title="Next Image">&gt;</button>
            </div>
            <div style="font-size: 0.8rem; color: #666; white-space: nowrap;">
                Saved: <span id="qa-saved-status">Synced</span>
            </div>
        </div>
    </footer>

    <!-- Comment Popup -->
    <div id="comment-popup" class="comment-popup" style="display: none;">
        <textarea id="box-comment-input" placeholder="Enter comment for this box..."></textarea>
        <div class="popup-actions">
            <button id="btn-save-comment" class="btn-primary">Save</button>
            <button id="btn-delete-comment" class="qa-btn incorrect" style="display: none;">Delete</button>
            <button id="btn-cancel-comment" class="qa-btn">Cancel</button>
        </div>
    </div>

    <script src="/static/app.js?v=21"></script>
</body>

</html>
